<section id="about">      <h1>이병호(Byeongho Lee)</h1>
      <p>저는 한국의 과학철학자입니다. 서울대학교 자연과학대학 과학사 및 과학철학 협동과정에서 과학적 이해에 관한 연구로 이학박사학위를 받았습니다. 서울대학교 인문대학 철학과와 국립한밭대학교 인문교양학부에서 과학과 기술에 대한 철학 과목을 강의합니다. 과학기술정보통신부 및 정보통신기획평가원의 지원을 받은 “사회적, 윤리적 학습을 위한 데이터 특성 및 생성 AI 모델의 윤리성 향상 연구” 과제의 연구원으로 일하고 있습니다.</p>
